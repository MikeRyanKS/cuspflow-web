<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A dental front desk checklist in two columns: three things to do before the first patient arrives, and three things to do after the last one leaves.">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="8" fill="#4361EE"/>

  <g font-family="Inter, system-ui, -apple-system, sans-serif">
    <rect x="60" y="70" width="520" height="500" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="60" y="70" width="520" height="80" rx="18" fill="#eef2ff"/>
    <text x="320" y="122" font-size="34" font-weight="700" fill="#3451D1" text-anchor="middle">Before the first patient</text>
    <text x="100" y="228" font-size="29" fill="#0f172a">Check today against who is</text>
    <text x="100" y="268" font-size="29" fill="#0f172a">actually in the building</text>
    <text x="100" y="352" font-size="29" fill="#0f172a">Count the float and write</text>
    <text x="100" y="392" font-size="29" fill="#0f172a">the number down</text>
    <text x="100" y="476" font-size="29" fill="#0f172a">Flag the patients who still</text>
    <text x="100" y="516" font-size="29" fill="#0f172a">owe from last time</text>

    <rect x="620" y="70" width="520" height="500" rx="18" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <rect x="620" y="70" width="520" height="80" rx="18" fill="#ecfdf5"/>
    <text x="880" y="122" font-size="34" font-weight="700" fill="#047857" text-anchor="middle">After the last patient</text>
    <text x="660" y="228" font-size="29" fill="#0f172a">Make sure nobody left</text>
    <text x="660" y="268" font-size="29" fill="#0f172a">without a finished bill</text>
    <text x="660" y="352" font-size="29" fill="#0f172a">Count the drawer against</text>
    <text x="660" y="392" font-size="29" fill="#0f172a">what the system expects</text>
    <text x="660" y="476" font-size="29" fill="#0f172a">Confirm tomorrow&#8217;s list</text>
    <text x="660" y="516" font-size="29" fill="#0f172a">before you go home</text>
  </g>
</svg>
