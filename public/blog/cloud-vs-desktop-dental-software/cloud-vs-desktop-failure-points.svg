<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Comparison of what stops work in a desktop dental system and in a cloud one: a dead front-desk machine against a dropped internet connection.">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="8" fill="#4361EE"/>
  <text x="600" y="98" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#0f172a" text-anchor="middle">Both can stop the clinic. Ask which failure you can fix</text>

  <g font-family="Inter, system-ui, -apple-system, sans-serif">
    <rect x="70" y="156" width="480" height="402" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="310" y="214" font-size="33" font-weight="600" fill="#0f172a" text-anchor="middle">Desktop, on one machine</text>
    <text x="310" y="282" font-size="26" fill="#475569" text-anchor="middle">Keeps working when the line drops</text>
    <text x="310" y="330" font-size="26" fill="#475569" text-anchor="middle">Backups are a person&#8217;s job</text>
    <text x="310" y="378" font-size="26" fill="#475569" text-anchor="middle">A second branch, a second copy</text>
    <rect x="110" y="420" width="400" height="106" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="310" y="464" font-size="26" font-weight="600" fill="#0f172a" text-anchor="middle">Worst day: that machine dies</text>
    <text x="310" y="502" font-size="25" fill="#475569" text-anchor="middle">and the last backup is old</text>

    <rect x="650" y="156" width="480" height="402" rx="16" fill="#eef2ff" stroke="#4361EE" stroke-width="2"/>
    <text x="890" y="214" font-size="33" font-weight="600" fill="#0f172a" text-anchor="middle">Cloud, in a browser</text>
    <text x="890" y="282" font-size="26" fill="#475569" text-anchor="middle">Any device, any branch, one record</text>
    <text x="890" y="330" font-size="26" fill="#475569" text-anchor="middle">Backups are not your job</text>
    <text x="890" y="378" font-size="26" fill="#475569" text-anchor="middle">Needs a working connection to use</text>
    <rect x="690" y="420" width="400" height="106" rx="12" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="890" y="464" font-size="26" font-weight="600" fill="#0f172a" text-anchor="middle">Worst day: the line is down</text>
    <text x="890" y="502" font-size="25" fill="#475569" text-anchor="middle">and the desk falls back to paper</text>
  </g>
</svg>
