<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="Four questions that decide between cloud and desktop dental software: branch count, who maintains the server, how the connection behaves at the busiest hour, and what happens to the data if you leave.">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="8" fill="#4361EE"/>
  <text x="600" y="98" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#0f172a" text-anchor="middle">Four questions that settle it faster than a demo</text>

  <g font-family="Inter, system-ui, -apple-system, sans-serif">
    <rect x="80" y="160" width="1040" height="94" rx="14" fill="#eef2ff" stroke="#4361EE" stroke-width="2"/>
    <text x="128" y="218" font-size="30" font-weight="700" fill="#3451D1">1</text>
    <text x="180" y="218" font-size="30" fill="#0f172a">How many places will need the same patient record this year?</text>

    <rect x="80" y="272" width="1040" height="94" rx="14" fill="#eef2ff" stroke="#4361EE" stroke-width="2"/>
    <text x="128" y="330" font-size="30" font-weight="700" fill="#3451D1">2</text>
    <text x="180" y="330" font-size="30" fill="#0f172a">Who, by name, restores a backup when the machine dies?</text>

    <rect x="80" y="384" width="1040" height="94" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="128" y="442" font-size="30" font-weight="700" fill="#059669">3</text>
    <text x="180" y="442" font-size="30" fill="#0f172a">What does your connection do at five o&#8217;clock on a Friday?</text>

    <rect x="80" y="496" width="1040" height="94" rx="14" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="128" y="554" font-size="30" font-weight="700" fill="#059669">4</text>
    <text x="180" y="554" font-size="30" fill="#0f172a">If you leave in two years, who hands you the records?</text>
  </g>
</svg>
