<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A flow showing a treatment billed in the clinic system, a fiscal receipt issued from the EFD or VFD, and the two totals reconciled at the end of the day">
  <rect x="0" y="0" width="1200" height="630" fill="#f8fafc"/>
  <text x="60" y="88" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" fill="#0f172a">Two records, one day, and they must agree</text>

  <rect x="60" y="150" width="320" height="260" rx="16" fill="#eef2ff" stroke="#4361EE" stroke-width="3"/>
  <text x="96" y="222" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#3451D1">1. Clinic system
    <tspan x="96" dy="52" font-size="28" font-weight="400" fill="#475569">Treatment plan, price,</tspan>
    <tspan x="96" dy="40" font-size="28" font-weight="400" fill="#475569">discount, payment and</tspan>
    <tspan x="96" dy="40" font-size="28" font-weight="400" fill="#475569">the named cashier.</tspan>
  </text>

  <path d="M 392 280 L 428 280" stroke="#475569" stroke-width="4" fill="none"/>
  <path d="M 420 268 L 432 280 L 420 292 Z" fill="#475569"/>

  <rect x="440" y="150" width="320" height="260" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
  <text x="476" y="222" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#0f172a">2. Your EFD or VFD
    <tspan x="476" dy="52" font-size="28" font-weight="400" fill="#475569">The fiscal receipt the</tspan>
    <tspan x="476" dy="40" font-size="28" font-weight="400" fill="#475569">TRA recognises, with</tspan>
    <tspan x="476" dy="40" font-size="28" font-weight="400" fill="#475569">its verification code.</tspan>
  </text>

  <path d="M 772 280 L 808 280" stroke="#475569" stroke-width="4" fill="none"/>
  <path d="M 800 268 L 812 280 L 800 292 Z" fill="#475569"/>

  <rect x="820" y="150" width="320" height="260" rx="16" fill="#ffffff" stroke="#10b981" stroke-width="3"/>
  <text x="856" y="222" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#059669">3. End of day
    <tspan x="856" dy="52" font-size="28" font-weight="400" fill="#475569">Count the till against</tspan>
    <tspan x="856" dy="40" font-size="28" font-weight="400" fill="#475569">what the system says</tspan>
    <tspan x="856" dy="40" font-size="28" font-weight="400" fill="#475569">was taken.</tspan>
  </text>

  <rect x="60" y="470" width="1080" height="96" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
  <text x="96" y="512" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#475569">No clinic system issues the fiscal receipt for you. Ask any vendor to say plainly
    <tspan x="96" dy="40">whether it connects to an EFD, and plan reception around the honest answer.</tspan>
  </text>
</svg>
