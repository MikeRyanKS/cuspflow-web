<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A Kenyan dental receipt flow: treatment billed in shillings, VAT at sixteen percent added as its own line, then a receipt the patient keeps.">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="8" fill="#4361EE"/>
  <text x="600" y="104" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#0f172a" text-anchor="middle">What a receipt has to get right in Kenya</text>

  <g font-family="Inter, system-ui, -apple-system, sans-serif">
    <rect x="70" y="190" width="300" height="170" rx="16" fill="#eef2ff" stroke="#4361EE" stroke-width="2"/>
    <text x="220" y="262" font-size="30" font-weight="600" fill="#0f172a" text-anchor="middle">Treatment billed</text>
    <text x="220" y="304" font-size="27" fill="#475569" text-anchor="middle">in Kenyan shillings</text>

    <path d="M390 275 L440 275" stroke="#4361EE" stroke-width="4"/>
    <path d="M440 262 L466 275 L440 288 Z" fill="#4361EE"/>

    <rect x="486" y="190" width="300" height="170" rx="16" fill="#eef2ff" stroke="#4361EE" stroke-width="2"/>
    <text x="636" y="262" font-size="30" font-weight="600" fill="#0f172a" text-anchor="middle">VAT at 16%</text>
    <text x="636" y="304" font-size="27" fill="#475569" text-anchor="middle">on its own line</text>

    <path d="M806 275 L856 275" stroke="#4361EE" stroke-width="4"/>
    <path d="M856 262 L882 275 L856 288 Z" fill="#4361EE"/>

    <rect x="902" y="190" width="228" height="170" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="1016" y="262" font-size="30" font-weight="600" fill="#0f172a" text-anchor="middle">Receipt the</text>
    <text x="1016" y="304" font-size="30" font-weight="600" fill="#0f172a" text-anchor="middle">patient keeps</text>

    <rect x="70" y="434" width="1060" height="124" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="110" y="486" font-size="29" font-weight="600" fill="#0f172a">Then ask the vendor the question that matters:</text>
    <text x="110" y="528" font-size="29" fill="#475569">what does this do about eTIMS, and what is still left for me to do?</text>
  </g>
</svg>
