<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="End-of-day cash reconciliation: what the system says the cashier took, minus what is actually in the drawer, equals a difference you find the same day.">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="8" fill="#4361EE"/>
  <text x="600" y="104" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="42" font-weight="700" fill="#0f172a" text-anchor="middle">The whole of reconciliation is one subtraction</text>

  <g font-family="Inter, system-ui, -apple-system, sans-serif">
    <rect x="70" y="200" width="330" height="180" rx="16" fill="#eef2ff" stroke="#4361EE" stroke-width="2"/>
    <text x="235" y="272" font-size="30" font-weight="600" fill="#0f172a" text-anchor="middle">Cash this cashier</text>
    <text x="235" y="312" font-size="30" font-weight="600" fill="#0f172a" text-anchor="middle">took today</text>
    <text x="235" y="352" font-size="26" fill="#475569" text-anchor="middle">per the system</text>

    <text x="440" y="305" font-size="56" font-weight="700" fill="#475569" text-anchor="middle">&#8722;</text>

    <rect x="480" y="200" width="330" height="180" rx="16" fill="#eef2ff" stroke="#4361EE" stroke-width="2"/>
    <text x="645" y="272" font-size="30" font-weight="600" fill="#0f172a" text-anchor="middle">What is actually</text>
    <text x="645" y="312" font-size="30" font-weight="600" fill="#0f172a" text-anchor="middle">in the drawer</text>
    <text x="645" y="352" font-size="26" fill="#475569" text-anchor="middle">counted by hand</text>

    <text x="850" y="305" font-size="56" font-weight="700" fill="#475569" text-anchor="middle">=</text>

    <rect x="890" y="200" width="240" height="180" rx="16" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="1010" y="292" font-size="30" font-weight="600" fill="#0f172a" text-anchor="middle">The gap</text>
    <text x="1010" y="332" font-size="26" fill="#475569" text-anchor="middle">if there is one</text>

    <text x="600" y="492" font-size="31" fill="#0f172a" text-anchor="middle">Do it tonight and it is a question for one person.</text>
    <text x="600" y="538" font-size="31" fill="#0f172a" text-anchor="middle">Do it at month end and it is nobody&#8217;s fault.</text>
  </g>
</svg>
