<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A two column checklist of what to settle before signing a lease for a second dental clinic and what to settle before opening the doors">
  <rect x="0" y="0" width="1200" height="630" fill="#f8fafc"/>
  <text x="60" y="86" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" fill="#0f172a">Two lists, and the order matters</text>

  <rect x="60" y="134" width="520" height="430" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="3"/>
  <text x="100" y="196" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#0f172a">Before you sign</text>
  <text x="100" y="262" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#475569">Chairs at the first site are full
    <tspan x="100" dy="58">You can be away a week</tspan>
    <tspan x="100" dy="58">A named person runs each day</tspan>
    <tspan x="100" dy="58">Prices written down, not recalled</tspan>
    <tspan x="100" dy="58">Lease and fit-out costed to the end</tspan>
  </text>

  <rect x="620" y="134" width="520" height="430" rx="16" fill="#eef2ff" stroke="#4361EE" stroke-width="3"/>
  <text x="660" y="196" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="32" font-weight="700" fill="#3451D1">Before you open</text>
  <text x="660" y="262" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="28" font-weight="400" fill="#475569">Every payment stamped with a branch
    <tspan x="660" dy="58">Stock counted per site, not pooled</tspan>
    <tspan x="660" dy="58">Receipt numbers that cannot clash</tspan>
    <tspan x="660" dy="58">Roles set for staff who cover both</tspan>
    <tspan x="660" dy="58">One patient record across sites</tspan>
  </text>
</svg>
