<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630" role="img" aria-label="A single spoken quote the patient refuses, next to the same treatment written as three phases with the price held, which the patient starts.">
  <rect width="1200" height="630" fill="#f8fafc"/>
  <rect x="0" y="0" width="1200" height="8" fill="#4361EE"/>
  <text x="600" y="98" font-family="Inter, system-ui, -apple-system, sans-serif" font-size="40" font-weight="700" fill="#0f172a" text-anchor="middle">Same treatment, two ways of presenting it</text>

  <g font-family="Inter, system-ui, -apple-system, sans-serif">
    <rect x="70" y="156" width="480" height="396" rx="16" fill="#ffffff" stroke="#e2e8f0" stroke-width="2"/>
    <text x="310" y="216" font-size="30" font-weight="600" fill="#475569" text-anchor="middle">One number, spoken aloud</text>
    <rect x="115" y="252" width="390" height="112" rx="12" fill="#f8fafc" stroke="#e2e8f0" stroke-width="2"/>
    <text x="310" y="322" font-size="26" fill="#0f172a" text-anchor="middle">Everything, all of it, today</text>
    <text x="310" y="428" font-size="26" fill="#475569" text-anchor="middle">The patient will think about it,</text>
    <text x="310" y="466" font-size="26" fill="#475569" text-anchor="middle">and nothing is written down</text>
    <text x="310" y="504" font-size="26" fill="#475569" text-anchor="middle">for the next visit.</text>

    <rect x="650" y="156" width="480" height="396" rx="16" fill="#eef2ff" stroke="#4361EE" stroke-width="2"/>
    <text x="890" y="216" font-size="30" font-weight="600" fill="#0f172a" text-anchor="middle">Three phases, on paper</text>
    <rect x="690" y="252" width="400" height="64" rx="10" fill="#ffffff" stroke="#4361EE" stroke-width="2"/>
    <text x="890" y="293" font-size="25" fill="#0f172a" text-anchor="middle">Phase 1  stop the pain</text>
    <rect x="690" y="330" width="400" height="64" rx="10" fill="#ffffff" stroke="#4361EE" stroke-width="2"/>
    <text x="890" y="371" font-size="25" fill="#0f172a" text-anchor="middle">Phase 2  restore the tooth</text>
    <rect x="690" y="408" width="400" height="64" rx="10" fill="#ecfdf5" stroke="#10b981" stroke-width="2"/>
    <text x="890" y="449" font-size="25" fill="#0f172a" text-anchor="middle">Phase 3  what can wait</text>
    <text x="890" y="516" font-size="26" fill="#475569" text-anchor="middle">The price is held for phase 2.</text>
  </g>
</svg>
