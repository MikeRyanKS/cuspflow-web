name = "cuspflow-web"
main = "worker/index.ts"
compatibility_date = "2024-09-23"

# Static export from `next build`. Assets that exist are served by the platform
# without invoking the Worker; anything else falls through to worker/index.ts,
# which serves /api/try and hands everything else back to ASSETS.
[assets]
directory = "./out"
binding = "ASSETS"

# Try It console limit: 10 requests a minute per IP, deliberately tighter than
# the 60/min an API key itself gets. namespace_id is a free-choice integer
# scoped to this Worker, not a resource that needs provisioning.
[[unsafe.bindings]]
name = "TRY_IT_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }
